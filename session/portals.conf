# The desktop's portals (portals.conf(5)), installed as shapebit-portals.conf
# for the desktop name ShapeBit: Hyprland's, for sharing the screen, with the
# shell's picker (xdph.conf); the shell's for files and screenshots
# (shell.portal); and GTK's for settings only, which gives applications in
# Flatpak the system's settings, such as the window buttons
# (window-buttons.gschema.override). Other interfaces are not offered.
[preferred]
default=hyprland
org.freedesktop.impl.portal.FileChooser=shell
org.freedesktop.impl.portal.Screenshot=shell
org.freedesktop.impl.portal.Settings=gtk
